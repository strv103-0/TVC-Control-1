; TVC-Control-1 펌웨어
; 보드 확정 전까지 후보별 환경을 나란히 둡니다.
; 사용할 환경을 default_envs 에 지정하세요.

[platformio]
default_envs = teensy41

[env]
framework = arduino
monitor_speed = 115200
build_flags =
    -Wall
    -Wextra

[env:teensy41]
platform = teensy
board = teensy41
; 필요 시 라이브러리 추가:
; lib_deps =
;     electroniccats/MPU6050

[env:stm32f411]
platform = ststm32
board = blackpill_f411ce
upload_protocol = dfu
